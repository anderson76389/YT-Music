<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Music — Mini-lecteur</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;color:#fff;background:#171719;font:14px 'Segoe UI',Arial,sans-serif}
body{border:1px solid #36363b;display:flex;flex-direction:column;padding:12px 15px;gap:12px}
header{display:flex;align-items:center;gap:8px;height:26px;flex-shrink:0;-webkit-app-region:drag;font-weight:600}
.brand{width:18px;height:18px;display:grid;place-items:center;background:#ff2847;border-radius:50%;font-size:10px}
header button{margin-left:auto;-webkit-app-region:no-drag;color:#b7b7bd;font-size:22px}
button{border:0;background:transparent;color:white;cursor:pointer;display:grid;place-items:center;border-radius:9px;width:32px;height:32px;padding:0}
button:hover{background:#343438}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}button:disabled{opacity:.4;cursor:default}
.track{display:flex;align-items:center;gap:13px;min-width:0;height:70px}
.cover{width:70px;height:70px;flex:none;background:#2d2d32;border-radius:9px;display:grid;place-items:center;overflow:hidden;font-size:25px;color:#aaa}
.cover img{width:100%;height:100%;object-fit:cover;display:none}
.meta{min-width:0}.meta div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#title{font-size:15px;font-weight:600;margin-bottom:5px}#artist{font-size:12px;color:#b5b5bd}
.controls{display:flex;align-items:center;justify-content:center;gap:24px;height:44px}
.controls button{height:38px;width:38px}.controls .play{background:#fff;color:#18181a;border-radius:50%;height:42px;width:42px}.controls .play:hover{background:#d9d9dc}
svg{width:21px;height:21px;fill:currentColor;pointer-events:none}
.volume{display:flex;align-items:center;gap:9px;min-height:24px}.volume svg{width:16px;height:16px;flex:none;color:#bdbdc3}
#volume{flex:1;min-width:0;margin:0;appearance:none;height:4px;border-radius:10px;background:linear-gradient(to right,#fff var(--level,0%),#4a4a50 var(--level,0%));cursor:pointer}
#volume::-webkit-slider-thumb{appearance:none;width:11px;height:11px;background:#fff;border-radius:50%}
#volume:disabled{opacity:.4;cursor:default}#value{width:35px;text-align:right;color:#c1c1c5;font-size:11px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header><span class="brand" aria-hidden="true">▶</span>YT Music <button id="close" aria-label="Fermer le mini-lecteur">×</button></header>
<div class="track"><div class="cover"><span id="placeholder" aria-hidden="true">♫</span><img id="cover" alt=""></div><div class="meta"><div id="title">Aucun titre</div><div id="artist">YT Music</div></div></div>
<div class="controls">
<button id="previous" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 10-7v14z"/></svg></button>
<button id="play" class="play" aria-label="Lecture"><svg viewBox="0 0 24 24"><path id="play-icon" d="M8 5v14l11-7z"/></svg></button>
<button id="next" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l10 7-10 7z"/></svg></button>
</div>
<div class="volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zm11-1v8a4 4 0 0 0 0-8z"/></svg><input id="volume" type="range" min="0" max="100" value="0" disabled aria-label="Volume de YT Music"><span id="value">—</span></div>
<script>
const api=window.miniPlayer;
const byId=id=>document.getElementById(id);
const slider=byId('volume'), value=byId('value'), play=byId('play');
let dragging=false, pendingFrame=0;
const displayVolume=(n,muted=false)=>{slider.value=String(n);slider.style.setProperty('--level',n+'%');value.textContent=muted?'Muet':n+'%';};
for(const cmd of ['close','previous','play','next']) byId(cmd).addEventListener('click',()=>api.command(cmd));
slider.addEventListener('pointerdown',()=>{dragging=true});
window.addEventListener('pointerup',()=>{dragging=false});
window.addEventListener('pointercancel',()=>{dragging=false});
slider.addEventListener('input',()=>{
  displayVolume(Number(slider.value));
  if(!pendingFrame) pendingFrame=requestAnimationFrame(()=>{pendingFrame=0;api.command('volume',Number(slider.value));});
});
api.onState(s=>{
  document.documentElement.dataset.miniReady='true';
  byId('title').textContent=s.title||'Aucun titre';
  byId('artist').textContent=s.artist||'YT Music';
  const cover=byId('cover');
  if(s.cover && cover.getAttribute('src')!==s.cover) cover.src=s.cover;
  if(!s.cover) cover.removeAttribute('src');
  cover.style.display=s.cover?'block':'none';
  byId('placeholder').style.display=s.cover?'none':'block';
  play.setAttribute('aria-label',s.playing?'Pause':'Lecture');
  byId('play-icon').setAttribute('d',s.playing?'M7 5h4v14H7zm6 0h4v14h-4z':'M8 5v14l11-7z');
  slider.disabled=s.volume===null;
  if(!dragging&&!pendingFrame&&s.volume!==null) displayVolume(s.volume,s.muted);
});
window.addEventListener('keydown',e=>{if(e.key==='Escape')api.command('close')});
</script>
</body>
</html>
