name: Verification du code

on:
  push:
    branches: [main, audit-plugins-20261014]
  pull_request:
  workflow_dispatch:
  schedule:
    # Une régression hebdomadaire dans GitHub Actions.
    # Ne remplace pas les tests réels sur YouTube Music.
    - cron: '17 6 * * 2'

permissions:
  contents: read

jobs:
  build-and-tests:
    name: Verification Windows (analyse, tests, compilation)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Auditer la présence des 34 plugins et les 8 suppressions
        run: node tools/audit-plugin-sources.mjs

      - name: Installer les dependances verrouillees
        run: pnpm install --frozen-lockfile

      - name: Linter
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Verifier le format
        id: format
        run: pnpm format:check
        continue-on-error: true

      - name: Verifier les types TypeScript
        id: typecheck
        run: pnpm typecheck
        continue-on-error: true

      - name: Tests unitaires Playwright existants
        id: tests
        run: pnpm test
        continue-on-error: true

      - name: Compiler Electron (sans generer d'installateur)
        id: build
        run: pnpm build
        continue-on-error: true

      - name: Signaler le formatage historique sans masquer les autres tests
        if: ${{ always() && steps.format.outcome == 'failure' }}
        shell: pwsh
        run: |
          Write-Warning 'Le depot contient des fichiers historiques non formates. Ceci ne bloque pas les tests ni la compilation.'
          "### Formatage a traiter" >> $env:GITHUB_STEP_SUMMARY
          "Les fichiers existants ne passent pas encore \`pnpm format:check\`. Le formatage reste visible dans les journaux mais n'est plus une erreur de compilation." >> $env:GITHUB_STEP_SUMMARY

      - name: Signaler les erreurs de code et de compilation
        if: ${{ always() && (steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.build.outcome == 'failure') }}
        run: exit 1
