name: Mettre a jour les icones YT Music

on:
  push:
    paths:
      - assets/icon.svg
      - tools/generate_ytmusic_icons.py
      - .github/workflows/sync-ytmusic-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    name: Generer et synchroniser les fichiers de logo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperer YT Music
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generer PNG et ICO sans telechargement d'image
        run: python tools/generate_ytmusic_icons.py

      - name: Enregistrer les icones dans le depot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon.png assets/tray.png assets/generated/icons/png/ assets/generated/icons/win/icon.ico
          if git diff --cached --quiet; then
            echo "Toutes les icones sont deja identiques."
          else
            git commit -m "assets: icones YouTube Music officielles generees pour toutes les plateformes"
            git push origin HEAD:main
          fi

      - name: Publier les ressources graphiques generees
        uses: actions/upload-artifact@v4
        with:
          name: YT-Music-Icones
          path: |
            assets/icon.png
            assets/tray.png
            assets/generated/icons/png/
            assets/generated/icons/win/icon.ico
          retention-days: 30
