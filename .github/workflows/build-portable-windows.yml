name: Construire et publier YT Music Windows

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tools/generate_ytmusic_icons.py'
      - 'vite-plugins/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'electron-builder.yml'
      - 'electron.vite.config.mts'
      - '.github/workflows/build-portable-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yt-music-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-windows:
    name: Build portable + installateur + GitHub Release
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Recuperer les sources de YT Music
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Installer Python pour les icones
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generer les icones PNG et ICO
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python tools/generate_ytmusic_icons.py

      - name: Auditer la présence des 34 plugins et les 8 suppressions
        run: node tools/audit-plugin-sources.mjs

      - name: Installer les dependances verrouillees
        run: pnpm install --frozen-lockfile

      - name: Analyse statique
        run: pnpm lint

      - name: Verifier les types
        run: pnpm typecheck

      - name: Executer les tests de plugins et menus
        run: pnpm test

      - name: Compiler le code Electron
        run: pnpm build

      - name: Attribuer une version unique a ce build
        shell: pwsh
        run: |
          $base = Get-Content package.json -Raw | ConvertFrom-Json
          $major, $minor, $patch = $base.version.Split('.')
          $nextPatch = [int]$patch + [int]$env:GITHUB_RUN_NUMBER
          $version = "$major.$minor.$nextPatch"
          "YT_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version app : $version"

      - name: Construire le portable et l'installateur Windows x64
        shell: pwsh
        run: |
          pnpm exec electron-builder --win nsis:x64 portable:x64 --publish never "-c.extraMetadata.version=$env:YT_RELEASE_VERSION"

      - name: Generer le manifeste de mise a jour SHA512
        shell: pwsh
        run: |
          python tools/generate-update-manifest.py
          if (-not (Test-Path -LiteralPath 'pack/latest.yml')) {
            throw 'Le manifeste latest.yml est introuvable'
          }
          Get-Content pack/latest.yml

      - name: Verifier les deux executables et leurs signatures de taille
        shell: pwsh
        run: |
          $expected = @(
            'YT-Music-Portable-Windows-x64.exe',
            'YT-Music-Setup-Windows-x64.exe'
          )
          $found = @(Get-ChildItem pack -Filter '*.exe' -File)
          if ($found.Count -ne 2) {
            throw "Deux .exe attendus, trouve : $($found.Name -join ', ')"
          }
          foreach ($name in $expected) {
            $file = Join-Path pack $name
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Fichier absent : $name"
            }
            if ((Get-Item -LiteralPath $file).Length -lt 10000000) {
              throw "Executable trop petit : $name"
            }
            Get-FileHash -LiteralPath $file -Algorithm SHA256 |
              Format-List
          }

      - name: Conserver les deux executables comme artefacts de secours
        uses: actions/upload-artifact@v4
        with:
          name: YT-Music-Windows-x64-Portable-et-Installateur
          path: |
            pack/YT-Music-Portable-Windows-x64.exe
            pack/YT-Music-Setup-Windows-x64.exe
            pack/latest.yml
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publier automatiquement la version dans Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "$env:YT_RELEASE_VERSION"
          $tag = "v$version"
          $title = "YT Music $version - Windows portable + installateur (build ${{ github.run_number }})"
          $notes = @"
          ### YT Music — Windows x64

          Deux versions Windows 64 bits, issues du même code source :

          - **YT-Music-Setup-Windows-x64.exe** : installation complète avec raccourcis Bureau et menu Démarrer, choix du dossier et désinstallation Windows.
          - **YT-Music-Portable-Windows-x64.exe** : utilisation sans installation, sans création ni modification automatique des raccourcis Windows.

          Pour garder un raccourci fixe dans Windows, choisissez **Setup**.
          Programme non officiel compilé exclusivement depuis ce dépôt GitHub.
          - L'analyse statique, la vérification TypeScript et les tests automatisés ont réussi avant publication.
          - Inclut les correctifs de menus et les modules de plugins présents dans ce commit.
          - La compilation ne garantit pas que les publicités et chaque plugin fonctionnent en conditions réelles.

          Commit : ${{ github.sha }}
          "@
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          gh release create "$tag" "pack/YT-Music-Portable-Windows-x64.exe" "pack/YT-Music-Setup-Windows-x64.exe" "pack/latest.yml" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "$title" --notes-file release-notes.md --latest

      - name: Afficher le lien permanent des versions
        shell: pwsh
        run: |
          "## YT Music Windows — telechargement" >> $env:GITHUB_STEP_SUMMARY
          "[Toutes les versions](https://github.com/$env:GITHUB_REPOSITORY/releases)" >> $env:GITHUB_STEP_SUMMARY
          "[Derniere version](https://github.com/$env:GITHUB_REPOSITORY/releases/latest)" >> $env:GITHUB_STEP_SUMMARY
          "[Installateur](https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/YT-Music-Setup-Windows-x64.exe)" >> $env:GITHUB_STEP_SUMMARY
          "[Portable](https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/YT-Music-Portable-Windows-x64.exe)" >> $env:GITHUB_STEP_SUMMARY
