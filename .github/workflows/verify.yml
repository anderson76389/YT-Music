name: Verification du code

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-tests:
    name: Verification Windows (analyse, tests, compilation)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Installer les dependances verrouillees
        run: pnpm install --frozen-lockfile

      - name: Linter
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Verifier le format
        id: format
        run: pnpm format:check
        continue-on-error: true

      - name: Verifier les types TypeScript
        id: typecheck
        run: pnpm typecheck
        continue-on-error: true

      - name: Tests unitaires Playwright existants
        id: tests
        run: pnpm test
        continue-on-error: true

      - name: Compiler Electron (sans generer d'installateur)
        id: build
        run: pnpm build
        continue-on-error: true

      - name: Signaler tout test en echec
        if: ${{ always() && (steps.lint.outcome == 'failure' || steps.format.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.build.outcome == 'failure') }}
        run: exit 1
